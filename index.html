<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div class="grain"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="grid">
    <button class="clear span2" onclick="clearAll()">AC</button>
    <button class="op" onclick="deleteLast()">⌫</button>
    <button class="op" onclick="input('/')">÷</button>

    <button onclick="input('7')">7</button>
    <button onclick="input('8')">8</button>
    <button onclick="input('9')">9</button>
    <button class="op" onclick="input('*')">×</button>

    <button onclick="input('4')">4</button>
    <button onclick="input('5')">5</button>
    <button onclick="input('6')">6</button>
    <button class="op" onclick="input('-')">−</button>

    <button onclick="input('1')">1</button>
    <button onclick="input('2')">2</button>
    <button onclick="input('3')">3</button>
    <button class="op" onclick="input('+')">+</button>

    <button class="zero" onclick="input('0')">0</button>
    <button onclick="input('.')">.</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
